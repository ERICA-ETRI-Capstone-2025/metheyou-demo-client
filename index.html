<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="AI 기반 유튜브 컨텐츠 분석 솔루션" />
    <meta name="theme-color" content="#ffffff" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="믿어유" />
    
    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="믿어유 - AI 기반 유튜브 컨텐츠 분석 솔루션" />
    <meta property="og:description" content="AI 기반 유튜브 컨텐츠 분석 솔루션" />
    <meta property="og:image" content="/og_banner.png" />
    <meta property="og:url" content="https://metheyou.pdj.kr" />
    
    <link rel="preconnect" href="https://cdn.jsdelivr.net">
    <link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" rel="stylesheet">
    <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">
    
    <!-- Favicon -->
    <link rel="icon" type="image/png" href="/icon-192.png" sizes="192x192" />
    <link rel="icon" type="image/png" href="/icon-512.png" sizes="512x512" />
    <link rel="shortcut icon" href="/icon-192.png" type="image/png" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    
    <title>믿어유 - AI 기반 유튜브 컨텐츠 분석 솔루션</title>
    <script>
      (function() {
        try {
          var THEME_COLORS = {
            light: '#ffffff',
            dark: '#1a1a1c'
          };

          var updateThemeUI = function(activeTheme) {
            document.documentElement.setAttribute('data-theme', activeTheme);
            var metaThemeColor = document.querySelector('meta[name="theme-color"]');
            if (metaThemeColor) {
              metaThemeColor.setAttribute('content', THEME_COLORS[activeTheme] || THEME_COLORS.light);
            }
          };

          var localTheme = localStorage.getItem('theme');
          var theme = localTheme || 'auto';
          var mediaQuery = window.matchMedia('(prefers-color-scheme: dark)');
          var activeTheme = theme === 'auto' 
            ? (mediaQuery.matches ? 'dark' : 'light')
            : theme;

          updateThemeUI(activeTheme);

          if (theme === 'auto') {
            mediaQuery.addEventListener('change', function(e) {
              updateThemeUI(e.matches ? 'dark' : 'light');
            });
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
